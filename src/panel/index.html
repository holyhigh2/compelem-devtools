<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compelem DevTools</title>
  <link rel="stylesheet" href="styles/panel.css">
</head>

<body>
  <div id="app">
    <!-- 顶部工具栏 -->
    <header class="toolbar">
      <div class="toolbar-left">
        <div class="brand">
          <img src="../icon16.png" width="16" height="16" alt="Compelem" class="brand-logo">
          <span>Compelem DevTools</span>
        </div>
        <span class="toolbar-sep"></span>
        <button id="btn-refresh" class="toolbar-btn" title="Refresh">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 4v6h-6" />
            <path d="M1 20v-6h6" />
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
          </svg>
        </button>
        <button id="btn-clear" class="toolbar-btn" title="Clear All Logs">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6" />
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
          </svg>
        </button>
        <button id="auto-refresh-toggle" class="auto-refresh" title="点击切换手动/自动刷新">
          <span id="auto-refresh-dot" class="auto-refresh-dot"></span>
          <span id="auto-refresh-label">手动</span>
        </button>
      </div>
      <div class="toolbar-center">
        <input id="search-filter" type="text" class="search-input" placeholder="🔍 搜索组件 (tagName, className, cid)">
      </div>
      <div class="toolbar-right">
        <span id="component-count" class="toolbar-count">0 components</span>
        <button id="theme-toggle" class="theme-toggle" title="切换主题" aria-label="切换主题">
          <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2">
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
          </svg>
          <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
        </button>
      </div>
    </header>

    <!-- 主体布局 -->
    <main class="main-layout">
      <!-- 左侧导航栏 -->
      <nav class="sidebar">
        <button class="nav-item active" data-tab="tree">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path
              d="M17 10v6M2 10l1.5-2.5L5 7m5 4v6m4-6v6m1-10V4a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v3M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3" />
          </svg>
          <span>组件树</span>
        </button>
        <button class="nav-item" data-tab="timeline">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="20" x2="12" y2="10" />
            <line x1="18" y1="20" x2="18" y2="4" />
            <line x1="6" y1="20" x2="6" y2="16" />
          </svg>
          <span>时间线</span>
          <span class="nav-badge" id="badge-timeline">0</span>
        </button>
        <button class="nav-item" data-tab="events">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4" />
            <path d="M16 8v5a3 3 0 0 0 6 0" />
            <path d="M2 12a10 10 0 1 1 20 0v1a3 3 0 0 1-3 3h-1" />
          </svg>
          <span>事件</span>
          <span class="nav-badge" id="badge-events">0</span>
        </button>
        <button class="nav-item" data-tab="perf">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="20" x2="18" y2="10" />
            <line x1="12" y1="20" x2="12" y2="4" />
            <line x1="6" y1="20" x2="6" y2="14" />
          </svg>
          <span>性能</span>
        </button>
        <button class="nav-item" data-tab="deps">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="5" r="3" />
            <circle cx="5" cy="19" r="3" />
            <circle cx="19" cy="19" r="3" />
            <line x1="12" y1="8" x2="5" y2="16" />
            <line x1="12" y1="8" x2="19" y2="16" />
          </svg>
          <span>依赖</span>
        </button>
        <div class="nav-sep"></div>

        <button class="nav-item" data-tab="eco" data-seg="store">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <ellipse cx="12" cy="5" rx="9" ry="3" />
            <path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5" />
            <path d="M3 12c0 1.66 4.03 3 9 3s9-1.34 9-3" />
          </svg>
          <span>Store</span>
          <span class="nav-dot" id="dot-eco-store"></span>
        </button>
        <button class="nav-item" data-tab="eco" data-seg="router">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="6" cy="19" r="3" />
            <path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15" />
            <circle cx="18" cy="5" r="3" />
          </svg>
          <span>Router</span>
          <span class="nav-dot" id="dot-eco-router"></span>
        </button>
        <button class="nav-item" data-tab="eco" data-seg="i18n">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10" />
            <line x1="2" y1="12" x2="22" y2="12" />
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
          </svg>
          <span>I18n</span>
          <span class="nav-dot" id="dot-eco-i18n"></span>
        </button>

        <div class="nav-spacer"></div>

        <button class="nav-item nav-item-compact" data-tab="help" title="帮助">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10" />
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
            <line x1="12" y1="17" x2="12.01" y2="17" />
          </svg>
        </button>
      </nav>

      <!-- 主内容区 -->
      <div class="content-area">
        <!-- 组件树 Tab -->
        <section id="tab-tree" class="tab-panel active">
          <div class="split-pane">
            <div class="pane-left">
              <div class="pane-header">
                <span>组件层级</span>
                <span class="pane-header-info" id="tree-info"></span>
              </div>
              <div id="tree-view" class="tree-container">
                <div class="empty-state">
                  <div class="empty-icon">🔌</div>
                  <div>正在等待 compelem 应用连接...</div>
                </div>
              </div>
            </div>
            <div class="pane-right">
              <div class="pane-header">
                <span>检查器</span>
                <div class="pane-header-actions">
                  <button id="btn-force-update" class="action-btn" title="Force Update">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
                    </svg>
                    强制更新
                  </button>
                </div>
              </div>
              <div id="component-detail" class="detail-container">
                <div class="empty-state">
                  <div class="empty-icon">👈</div>
                  <div>选择一个组件以查看其状态</div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- Timeline Tab -->
        <section id="tab-timeline" class="tab-panel">
          <div class="timeline-container">
            <div class="timeline-header">
              <span class="timeline-title">事件时间线</span>
              <div class="timeline-filters">
                <label class="filter-toggle"><input type="checkbox" data-filter="update" checked><span>更新</span></label>
                <label class="filter-toggle"><input type="checkbox" data-filter="event" checked><span>事件</span></label>
                <label class="filter-toggle"><input type="checkbox" data-filter="lifecycle"
                    checked><span>生命周期</span></label>
                <label class="filter-toggle"><input type="checkbox" data-filter="store"
                    checked><span>Store</span></label>
                <label class="filter-toggle"><input type="checkbox" data-filter="route"
                    checked><span>Route</span></label>
                <label class="filter-toggle"><input type="checkbox" data-filter="locale"
                    checked><span>Locale</span></label>
              </div>
            </div>
            <div id="timeline-chart" class="timeline-chart"></div>
            <div id="timeline-list" class="timeline-list"></div>
          </div>
        </section>

        <!-- Events Tab -->
        <section id="tab-events" class="tab-panel">
          <div class="events-container">
            <div class="events-header">
              <span>事件日志</span>
              <div class="events-summary" id="events-summary"></div>
            </div>
            <div class="events-table-header">
              <span class="ev-col-time">时间</span>
              <span class="ev-col-comp">组件</span>
              <span class="ev-col-type">类型</span>
              <span class="ev-col-name">事件名</span>
              <span class="ev-col-args">参数</span>
            </div>
            <div id="event-log" class="events-body"></div>
          </div>
        </section>

        <!-- Performance Tab -->
        <section id="tab-perf" class="tab-panel">
          <div id="perf-content" class="perf-content">
            <div class="empty-state">
              <div class="empty-icon">📊</div>
              <div>暂无性能数据。交互页面后查看更新统计。</div>
            </div>
          </div>
        </section>

        <!-- Deps Tab -->
        <section id="tab-deps" class="tab-panel">
          <div class="split-pane">
            <div class="pane-left">
              <div class="pane-header">
                <span>组件</span>
              </div>
              <div id="dep-list" class="list-container"></div>
            </div>
            <div class="pane-right">
              <div class="pane-header">
                <span>依赖图</span>
              </div>
              <div id="dep-inspector" class="detail-container">
                <div class="empty-state">
                  <div class="empty-icon">🔗</div>
                  <div>选择组件查看依赖关系</div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- Ecosystem Tab（Store / Router / I18n 各自一个左侧页签，共用此面板） -->
        <section id="tab-eco" class="tab-panel">
          <div class="split-pane">
            <div class="pane-left">
              <div class="pane-header">
                <span id="eco-list-title">Store</span>
                <span class="pane-header-info" id="eco-list-count"></span>
              </div>
              <div id="eco-list" class="list-container"></div>
            </div>
            <div class="pane-right">
              <div class="pane-header">
                <span id="eco-detail-title">详情</span>
                <span class="pane-header-info eco-seg-status" id="eco-seg-status"></span>
                <span class="pane-header-actions" id="eco-detail-actions"></span>
              </div>
              <div id="eco-detail" class="detail-container">
                <div class="empty-state">
                  <div class="empty-icon">📦</div>
                  <div>从左侧选择一个 store</div>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="panel.js"></script>
</body>

</html>
